<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Klinth live preview shell. The editor loads this page once, in a frame
      sandboxed without same-origin, then sends each rendered page here. It is
      a separate page (not srcdoc in the editor) so it gets its own, looser
      security policy: the editor's strict policy would block the site's
      scripts and pasted custom code. Each page is shown in a fresh inner
      frame (srcdoc, its own opaque origin), so redrawing needs no network and
      keeps working offline. The page talks to the editor through window.top.
    -->
    <iframe sandbox="allow-scripts" title="Your site"></iframe>
    <script>
      (function () {
        'use strict';
        var frame = document.querySelector('iframe');
        // The frame's origin is opaque, but its address still names the editor's origin.
        var editorOrigin = new URL(location.href).origin;
        window.addEventListener('message', function (event) {
          var data = event.data;
          if (event.source !== window.parent || !data || data.source !== 'klinth-editor') return;
          if (data.type === 'render' && typeof data.html === 'string') frame.srcdoc = data.html;
        });
        window.parent.postMessage({ source: 'klinth-preview', type: 'host' }, editorOrigin);
      })();
    </script>
  </body>
</html>
